<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Customer Support Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">
            <h1>AI Customer Support Analyzer</h1>
            <p>Analyze your customer support message with AI</p>
        </div>


        <!-- Chat messages -->
        <div id="chat-box" class="chat-box">

            <div class="message bot-message">
                <div class="message-content">
                    Hello! 👋<br><br>
                    Send me your customer support message and
                    I'll analyze it for you.
                </div>
            </div>

        </div>


        <!-- Input area -->
        <div class="input-area">

            <input
                type="text"
                id="message-input"
                placeholder="Type your customer message..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
